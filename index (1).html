<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger · AI/ML Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--sf:#fffdf9;--ink:#1d1b18;--mu:#7a736a;--ln:#e6e0d6;--ac:#c4572a;--lr:#d69a2d;--dn:#3f7d5a;--hv:#f0ebe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--sf:#1c1a17;--ink:#efe9df;--mu:#9b9387;--ln:#2e2a25;--ac:#e2784a;--lr:#e0ab4a;--dn:#6bb88a;--hv:#25221e}}
:root[data-theme="dark"]{--bg:#141311;--sf:#1c1a17;--ink:#efe9df;--mu:#9b9387;--ln:#2e2a25;--ac:#e2784a;--lr:#e0ab4a;--dn:#6bb88a;--hv:#25221e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:32px 20px;border-right:1px solid var(--ln)}
.logo{font:600 26px Fraunces,Georgia,serif;letter-spacing:-.02em}.logo b{color:var(--ac)}
.tag{color:var(--mu);font-size:12.5px;margin:2px 0 22px}
.big{font:500 44px/1 Fraunces,Georgia,serif;letter-spacing:-.03em}.big small{font-size:16px;color:var(--mu);margin-left:4px}
.bar{height:3px;background:var(--ln);border-radius:3px;margin:12px 0 26px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.nv{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:9px 12px 11px;border-radius:9px;cursor:pointer;position:relative;font-weight:500;font-size:14px}
.nv:hover{background:var(--hv)}.nv.on{background:var(--sf);box-shadow:0 0 0 1px var(--ln)}
.nv em{font-style:normal;color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.nv i{position:absolute;left:12px;bottom:4px;height:2px;background:var(--dn);border-radius:2px;max-width:calc(100% - 24px);transition:width .4s}
.sync{margin-top:22px;font-size:12px;color:var(--mu);line-height:1.45}.sync:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lr);margin-right:7px}.sync.ok:before{background:var(--dn)}
main{padding:44px 48px 80px;max-width:940px;width:100%}
h1{font:500 38px/1.1 Fraunces,Georgia,serif;letter-spacing:-.025em;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 20px}
.res{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.res a{color:var(--ink);text-decoration:none;font-size:13px;padding:6px 12px;border:1px solid var(--ln);border-radius:99px;background:var(--sf)}
.res a:hover{border-color:var(--ac);color:var(--ac)}.res a:after{content:" ↗";color:var(--mu)}
.ctl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0}
.ctl input{flex:1;min-width:180px;font:inherit;padding:10px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);outline:none}
.ctl input:focus{border-color:var(--ac)}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--sf)}
.seg button{all:unset;padding:10px 14px;font-size:13px;cursor:pointer;color:var(--mu)}.seg button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:16px;overflow:hidden}
.ch{display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px 10px}
.ch h2{margin:0;font:600 17px Fraunces,Georgia,serif}.ch span{color:var(--mu);font-size:12px;margin-left:10px}
.ch button{all:unset;cursor:pointer;font-size:12px;color:var(--mu)}.ch button:hover{color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));padding:0 10px 12px}
.t{all:unset;box-sizing:border-box;display:flex;gap:11px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.35}
.t:hover{background:var(--hv)}
.d{flex:none;width:17px;height:17px;margin-top:1px;border-radius:50%;border:1.5px solid var(--mu);position:relative;transition:.15s}
.t[data-v="1"] .d{border-color:var(--lr);background:linear-gradient(90deg,var(--lr) 50%,transparent 50%)}
.t[data-v="2"] .d{border-color:var(--dn);background:var(--dn)}
.t[data-v="2"] .d:after{content:"";position:absolute;left:4.5px;top:2px;width:4px;height:7px;border:solid var(--bg);border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.t[data-v="2"] span{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--ln)}
.empty{color:var(--mu);padding:40px 0;text-align:center}
.hint{color:var(--mu);font-size:12px;margin:-12px 0 22px}
@media(max-width:820px){.app{display:block}aside{position:static;height:auto;border:0;padding:22px 16px 6px}#nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.nv{width:auto;flex:none;white-space:nowrap;gap:10px}.big{font-size:34px}.bar{margin-bottom:14px}.sync{margin:6px 0 0}main{padding:20px 16px 60px}h1{font-size:30px}}
a.q{color:inherit;text-decoration:underline dotted var(--ac);text-underline-offset:3px}a.q:hover{color:var(--ac)}a.q:after{content:" ↗";color:var(--mu);font-size:11px}
.gr{cursor:grab;color:var(--mu);opacity:.45;margin-right:8px;font-size:11px;letter-spacing:-2px;touch-action:none;user-select:none}.nv:hover .gr{opacity:1}.sortable-ghost{opacity:.4}
.sync a{color:var(--ac);cursor:pointer}.bk{margin-top:6px}
.nnw{all:unset;cursor:pointer;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:18px;display:inline-block}
.nt{flex:1;min-width:0;font:600 17px Fraunces,Georgia,serif;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--ink);outline:none;padding:2px 0}.nt:focus{border-bottom-color:var(--ac)}
.na{display:flex;flex:none}.na button{margin-left:14px}
.nb{padding:0 20px 18px;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:14.5px;cursor:text}.nb a.q{word-break:break-all}.mu{color:var(--mu)}
.nbt{display:block;width:100%;min-height:120px;border:0;border-top:1px solid var(--ln);background:var(--hv);color:var(--ink);font:14.5px/1.6 Inter,system-ui,sans-serif;padding:14px 20px;outline:none;resize:none;overflow:hidden}
.nh{font:600 12px Inter,sans-serif;color:var(--mu);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.06em}
@media(max-width:820px){.gr{opacity:.8}}
